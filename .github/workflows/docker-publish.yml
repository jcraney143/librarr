name: Build and publish Docker image

# Builds the librarr image and pushes it to GHCR on every push to main, so
# deployments (the NAS's docker-compose.yml, and anyone else running this
# fork) just pull ghcr.io/jcraney143/librarr:latest - no git or buildx
# needed on the deploying machine, unlike a `build: <git-url>` context,
# which several Docker Compose setups (including UGOS's) don't support.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/librarr:latest
            ghcr.io/${{ github.repository_owner }}/librarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
